[package]
name = "camp"
edition = "2021"
default-run = "camp"

[workspace]
members = [
	"examples/http/axum",
	"examples/http/axum-connect",
	"examples/ratatui/counter",
	"examples/ratatui/counter-elm",
	"examples/ratatui/json-editor",
]

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "camp"
path = "src/main.rs"

[[bin]]
name = "camp-nw"
path = "src/main.rs"
required-features = ["windows_subsystem"]

[dependencies]
clap = { version = "=4.6.6", features = ["derive", "wrap_help"] }
git2 = "=0.21.0"
indexmap = "=2.14.2"
inquire = "=0.9.4"
owo-colors = "=4.4.0"
pyo3 = { version = "=0.29.2", features = ["extension-module"] }
regex = "=1.13.1"
reqwest = { version = "=0.13.5", features = ["blocking"] }
tokio = { version = "=1.53.1", features = ["full"] }
which = "=8.0.6"
windows-registry = "=0.100.0"
windows-service = "=0.8.1"

[target."cfg(windows)".dependencies.windows]
version = "=0.62.2"
features = [
	"Win32_Devices_Display",
	"Win32_Foundation",
	"Win32_Graphics_Gdi",
	"Win32_Security",
	"Win32_System_Com",
	"Win32_System_Console",
	"Win32_System_Environment",
	"Win32_System_Ole",
	"Win32_System_ProcessStatus",
	"Win32_System_RemoteDesktop",
	"Win32_System_Rpc",
	"Win32_System_Services",
	"Win32_System_Threading",
	"Win32_System_Variant",
	"Win32_System_Wmi",
	"Win32_UI_Accessibility",
	"Win32_UI_WindowsAndMessaging",
]

[features]
windows_subsystem = []
